image:
  repository: ghcr.io/drxen00/metamagic
  tag: latest
  pullPolicy: Always

# The upstream entrypoint starts as root to create the configured user and fix
# /config ownership, then launches the API and web processes as that user.
securityContext:
  container:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    PUID: 568
  pod:
    fsGroup: 568

service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3800
        port: 3800

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
              port: 3800
            readiness:
              type: tcp
              port: 3800
            startup:
              type: tcp
              port: 3800

persistence:
  config:
    enabled: true
    mountPath: /config
    readOnly: false
