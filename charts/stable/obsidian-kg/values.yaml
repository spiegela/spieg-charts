image:
  repository: docker.io/spiegela/obsidian-kg-mcp
  tag: 0.2.0
  pullPolicy: IfNotPresent

config:
  # Comma-separated vault folders hidden from agents (also as link targets).
  exclude: Private
  refreshSeconds: 60
  threads: 2
  logLevel: INFO
  # Expose kg_create/kg_append/kg_edit/kg_update_frontmatter/kg_trash. Needs a
  # writable vault mount and a container user that owns the vault files.
  writeEnabled: false

service:
  main:
    ports:
      main:
        protocol: http
        port: 8080
        targetPort: 8080

workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          env:
            KG_VAULT: /vault
            KG_CACHE_DIR: /cache
            KG_PORT: "8080"
            KG_EXCLUDE: '{{ .Values.config.exclude }}'
            KG_REFRESH_SECONDS: '{{ .Values.config.refreshSeconds }}'
            KG_THREADS: '{{ .Values.config.threads }}'
            KG_LOG_LEVEL: '{{ .Values.config.logLevel }}'
            KG_WRITE_ENABLED: '{{ .Values.config.writeEnabled }}'
            KG_DATA_DIR: /data
          probes:
            liveness:
              type: http
              path: /healthz
              port: 8080
            readiness:
              type: http
              path: /healthz
              port: 8080
            startup:
              type: http
              path: /healthz
              port: 8080
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 60

persistence:
  # The vault root (the folder containing .obsidian). Set readOnly: false for
  # write mode.
  vault:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /vault
    readOnly: true
  # Write mode: audit.jsonl and the pre-change copy of every modified note.
  data:
    enabled: true
    type: emptyDir
    mountPath: /data
    readOnly: false
  # Locally computed embeddings; only a cache.
  cache:
    enabled: true
    type: emptyDir
    mountPath: /cache
    readOnly: false

ingress:
  main:
    enabled: false
    hosts: []
    tls: []

securityContext:
  container:
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      add: []
      drop:
        - ALL
  pod:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1Gi

notes:
  custom: |-
    ## MCP endpoint
    obsidian-kg serves MCP (streamable HTTP) at /mcp and health at /healthz.
    It has no authentication of its own: expose it only behind an
    authenticating proxy (e.g. a Traefik forward-auth middleware).
