---
image:
  repository: docker.io/spiegela/navigatorr-mcp
  tag: 1.0.0
  pullPolicy: IfNotPresent

config:
  # Leave empty to generate and retain a 64-character token in the main Secret.
  # Set this explicitly when rendering offline through GitOps.
  authToken: ""
  maxResponseSizeKB: 50
  allowDestructive: false
  queuePath: /var/lib/navigatorr/queue.json
  services:
    sonarr:
      enabled: false
      url: http://sonarr:8989
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    radarr:
      enabled: false
      url: http://radarr:7878
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    lidarr:
      enabled: false
      url: http://lidarr:8686
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    readarr:
      enabled: false
      url: http://readarr:8787
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    chaptarr:
      enabled: false
      url: http://chaptarr:8789
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    prowlarr:
      enabled: false
      url: http://prowlarr:9696
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    profilarr:
      enabled: false
      url: http://profilarr:6868
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    bazarr:
      enabled: false
      url: http://bazarr:6767
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    seerr:
      enabled: false
      url: http://seerr:5055
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
    audiobookshelf:
      enabled: false
      url: http://audiobookshelf:13378
      apiKey: ""
      authMethod: ""
      authHeader: ""
      authPrefix: ""
      apiVersion: ""
      openapiUrl: ""
  transmission:
    enabled: false
    url: http://transmission:9091
    username: ""
    password: ""
  qbittorrent:
    enabled: false
    url: http://qbittorrent:8080
    username: ""
    password: ""
  sabnzbd:
    enabled: false
    url: http://sabnzbd:8080
    apiKey: ""
    urlBase: /sabnzbd

gateway:
  port: 8080
  path: /mcp
  maxSessions: 1
  sessionIdleTTL: 900
  maxMessageSize: "10485760"

service:
  main:
    ports:
      main:
        protocol: http
        port: 8080
        targetPort: 8080

workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - '{{ .Values.gateway.port }}'
            - --path
            - '{{ .Values.gateway.path }}'
            - --max-sessions
            - '{{ .Values.gateway.maxSessions }}'
            - --session-idle-ttl
            - '{{ .Values.gateway.sessionIdleTTL }}'
            - --max-message-size
            - '{{ .Values.gateway.maxMessageSize }}'
            - --
            - navigatorr
            - -config
            - /config/config.yaml
          env:
            MCP_STDIO_SERVE_TOKEN:
              secretKeyRef:
                name: main
                key: MCP_STDIO_SERVE_TOKEN
          probes:
            liveness:
              type: tcp
              port: 8080
            readiness:
              type: tcp
              port: 8080
            startup:
              type: tcp
              port: 8080

secret:
  main:
    enabled: true
    data:
      MCP_STDIO_SERVE_TOKEN: '{{ include "navigatorr.authToken" . }}'
      config.yaml: |-
        # Generated by the Navigatorr Helm chart.
        {{ include "navigatorr.configYaml" . | nindent 2 }}

persistence:
  config:
    enabled: true
    type: secret
    objectName: main
    expandObjectName: true
    optional: false
    defaultMode: "0440"
    mountPath: /config/config.yaml
    subPath: config.yaml
    readOnly: true
  state:
    enabled: true
    type: emptyDir
    mountPath: /var/lib/navigatorr
    readOnly: false

ingress:
  main:
    enabled: false
    hosts: []
    tls: []

securityContext:
  container:
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      add: []
      drop:
        - ALL
  pod:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 512Mi

notes:
  custom: |-
    ## MCP endpoint
    Navigatorr serves MCP at /mcp and requires an Authorization: Bearer header.
    The token is stored in the {{ .Release.Name }}-main Secret under
    MCP_STDIO_SERVE_TOKEN.
