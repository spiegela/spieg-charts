{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . }}

{{- if ne (int .Values.workload.main.replicas) 1 }}
  {{- fail "headscale uses a single SQLite database; run exactly one replica" }}
{{- end }}
{{- if not .Values.headscale.config.server_url }}
  {{- fail "headscale.config.server_url is required (the public HTTPS URL clients connect to)" }}
{{- end }}

{{/* Render the templates */}}
{{ include "tc.v1.common.loader.apply" . }}
