image:
  repository: ghcr.io/music-assistant/server
  tag: "2.10.9"
  pullPolicy: IfNotPresent

alexaSkill:
  repository: ghcr.io/alams154/music-assistant-skill
  tag: 0.0.39-beta
  pullPolicy: IfNotPresent

config:
  server:
    hostname:
    # -- Public HTTPS URL of the MA web/API server (port 8095); used as MA_API_URL
    url:
    # -- Public HTTPS URL that proxies the MA stream port (8097); used as MA_HOSTNAME
    streamUrl:
    apiToken:
  alexaSkill:
    url:
    username:
    password:
    # -- Skill ID (amzn1.ask.skill....) shown by /setup; restricts requests to this skill
    skillId: ""
    locale: en-US
    enableAPL: false
    skipUrlValidation: false

workload:
  main:
    podSpec:
      containers:
        main:
          args:
            - --data-dir
            - /data
            - --cache-dir
            - /data/.cache
          env:
            APPDATA: /data
        alexa-skill:
          enabled: true
          primary: false
          imageSelector: alexaSkill
          securityContext:
            # The upstream image writes to /app/{build,tmp} and expects ASK CLI
            # credentials under /root/.ask, so it has to run as root.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
          env:
            SKILL_HOSTNAME: '{{ .Values.config.alexaSkill.url }}'
            SKILL_ID: '{{ .Values.config.alexaSkill.skillId }}'
            # The skill wants a bare host here; it prepends https:// itself
            MA_HOSTNAME: '{{ .Values.config.server.streamUrl | default .Values.config.server.url | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}'
            MA_API_URL: '{{ .Values.config.server.url }}'
            MA_API_TOKEN: '{{ .Values.config.server.apiToken }}'
            APP_USERNAME:
              secretKeyRef:
                name: main
                key: APP_USERNAME
            APP_PASSWORD:
              secretKeyRef:
                name: main
                key: APP_PASSWORD
            PORT: '{{ (index .Values.service.main.ports "alexa-skill").targetPort | default (index .Values.service.main.ports "alexa-skill").port }}'
            # 0 disables debugpy; a non-zero port exposes remote code execution
            DEBUG_PORT: "0"
            LOCALE: '{{ .Values.config.alexaSkill.locale }}'
            ENABLE_APL: '{{ .Values.config.alexaSkill.enableAPL }}'
            SKIP_URL_VALIDATION: '{{ .Values.config.alexaSkill.skipUrlValidation }}'
            DEVICE_MAPPING_PATH: /root/.ask/device_players.json
            AWS_DEFAULT_REGION: us-east-1
          probes:
            liveness:
              enabled: true
              type: '{{ (index .Values.service.main.ports "alexa-skill").protocol }}'
              port: '{{ (index .Values.service.main.ports "alexa-skill").targetPort | default (index .Values.service.main.ports "alexa-skill").port }}'
            readiness:
              enabled: true
              type: '{{ (index .Values.service.main.ports "alexa-skill").protocol }}'
              port: '{{ (index .Values.service.main.ports "alexa-skill").targetPort | default (index .Values.service.main.ports "alexa-skill").port }}'
            startup:
              enabled: true
              type: '{{ (index .Values.service.main.ports "alexa-skill").protocol }}'
              port: '{{ (index .Values.service.main.ports "alexa-skill").targetPort | default (index .Values.service.main.ports "alexa-skill").port }}'

service:
  main:
    ports:
      main:
        enabled: true
        primary: true
        protocol: http
        port: 8095
        targetPort: 8095
      stream:
        enabled: true
        primary: false
        protocol: http
        port: 8097
        targetPort: 8097
      alexa-skill:
        enabled: true
        port: 5000
        targetPort: 5000
        protocol: tcp
      bonjour:
        enabled: true
        port: 5353
        targetPort: 5353
        protocol: tcp
      rtsp:
        enabled: true
        port: 554
        targetPort: 554
        protocol: tcp
      chromecast:
        enabled: true
        port: 8008
        targetPort: 8008
        protocol: tcp

securityContext:
  container:
    capabilities:
      add:
        - SYS_ADMIN
        - DAC_READ_SEARCH

secret:
  main:
    enabled: true
    data:
      APP_USERNAME : '{{ .Values.config.alexaSkill.username }}'
      APP_PASSWORD: '{{ .Values.config.alexaSkill.password }}'

persistence:
  # ASK CLI credentials plus the Echo-to-MA device mapping for the skill container
  alexa-skill-ask-data:
    enabled: true
    targetSelector:
      main:
        alexa-skill:
          mountPath: /root/.ask
          readOnly: false
  data:
    enabled: true
    mountPath: /data
    readOnly: false
